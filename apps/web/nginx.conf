server {
  listen 80;
  root /usr/share/nginx/html;

  # DNS interno de Docker: con la URL en una variable, nginx vuelve a resolver «api»
  # en lugar de quedarse con la IP del arranque (que cambia si el contenedor se recrea).
  resolver 127.0.0.11 valid=10s;
  set $api_upstream http://api:3000;

  # La API se sirve bajo el mismo origen: sin CORS y con la cookie de sesión funcionando.
  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Recursos con hash en el nombre: caché larga.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Rutas de la SPA.
  location / {
    try_files $uri /index.html;
  }
}
